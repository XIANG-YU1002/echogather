name: Deploy frontend to Cloudflare

# 把前端同時部署到 Cloudflare Workers（主要網址 www.echogather.workers.dev）。
#
# 與 deploy-frontend.yml（GitHub Pages）並存：兩者跑同一份程式碼，
# 差別只在 base path。原本 Cloudflare 這份要人工跑 wrangler deploy，
# 靠「記得做」遲早會漏，導致兩個網址版本不一致——所以改成自動。
#
# 需要在 repo 設定：
#   Secrets → CLOUDFLARE_API_TOKEN（於 Cloudflare 用 "Edit Cloudflare Workers"
#             模板建立；放 Secrets 而非 Variables，才會加密且不寫進 log）
#   Variables → VITE_API_BASE_URL（與 GitHub Pages 那份共用，已設定）

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch: # 允許在 Actions 頁面手動觸發

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 必須 22 以上：wrangler 4.x 要求 Node >= 22，用 20 會直接拒絕執行
          # （這就是 2026-07-31 連續四次部署失敗的真正原因，
          #   錯誤訊息藏在 log 中段，被結尾的 exit code 1 掩蓋掉）
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Cloudflare 部署在網域根目錄，base 必須是 "/"；
          # 少了這個會建置成 /echogather/（GitHub Pages 用的），JS/CSS 全部 404。
          DEPLOY_BASE: "/"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      # 刻意不用 cloudflare/wrangler-action：它會把 wrangler 的實際錯誤吞掉，
      # 只回「The process ... failed with exit code 1」，完全無從除錯
      # （為此連續失敗三次都查不出原因）。直接跑指令，輸出才看得到。
      # 版本釘在與本機一致的 4.116.0：預設的 3.90.0 解析不了本專案
      # wrangler.jsonc 用到的 JSONC 註解與 Static Assets 設定。
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.116.0 deploy
