name: Deploy frontend to GitHub Pages

# 只部署前端（React + Vite 靜態檔）。
# GitHub Pages 無法執行 FastAPI 後端，後端需另找主機，
# 並把網址設在 repo 的 Variables → VITE_API_BASE_URL。

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: # 允許在 Actions 頁面手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新的推送會取代排隊中的舊任務
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # 後端尚未部署時留空，client.js 會退回本機網址（線上呼叫會失敗但不會白屏）。
          # 後端上線後到 repo Settings → Secrets and variables → Actions → Variables
          # 新增 VITE_API_BASE_URL，例如 https://your-api.onrender.com/api/v1
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Add SPA fallback
        # GitHub Pages 是純靜態主機，直接開 /orders 這種前端路由會回 404。
        # 把 index.html 複製成 404.html，讓 Pages 用同一份 SPA 外殼回應，
        # 再由 React Router 依網址決定畫面。
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
